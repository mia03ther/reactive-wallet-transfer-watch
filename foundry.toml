[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@reactive/=lib/reactive-lib-omni/",
  "forge-std/=lib/reactive-lib-omni/lib/forge-std/src/"
]

[rpc_endpoints]
lasna = "https://lasna-rpc.rnk.dev/"
sepolia = "https://11155111.rpc.thirdweb.com"
